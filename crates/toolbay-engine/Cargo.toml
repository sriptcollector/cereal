[package]
name = "toolbay-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared local AI engine for Toolbay tools: model catalog, downloads, whisper.cpp / llama.cpp / sherpa-onnx runners, hardware detection and the optional cloud engines."
repository = "https://github.com/sriptcollector/cereal"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
once_cell = "1"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Graphics_Dxgi",
  "Win32_System_SystemInformation",
] }
