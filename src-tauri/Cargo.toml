[package]
name = "cereal"
version = "0.2.1"
description = "Cereal: free, local, open-source AI meeting notes. No bot joins your call."
authors = ["Orion Jones"]
license = "MIT"
repository = "https://github.com/sriptcollector/cereal"
edition = "2021"

[lib]
name = "cereal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
url = "2"
urlencoding = "2"
toolbay-engine = { path = "../crates/toolbay-engine" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
cpal = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
log = "0.4"
chrono-tz = "0.10"
tauri-plugin-dialog = "2"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "wav", "flac", "vorbis", "ogg", "pcm", "adpcm"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Recovery",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio",
] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "11"
