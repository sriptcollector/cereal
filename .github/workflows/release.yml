name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    env:
      # Signs update packages so installed copies can update themselves.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      # Speech, notes and speaker engines + starter models that ship inside the installer.
      - run: npm run bundle
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-msvc' || (contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') }}
      - run: cargo test --workspace
        if: matrix.os == 'windows-latest'
      # Code signing turns on by itself once the certificates are added as
      # repository secrets (see docs/SIGNING.md). Without them builds are unsigned.
      # macOS: always at least ad-hoc signed with the hardened runtime and
      # Entitlements.plist (signingIdentity "-" in tauri.conf.json), so Gatekeeper
      # offers "Open Anyway" instead of calling the app damaged. Once the Apple
      # secrets exist (docs/SIGNING.md) the same build is signed with the
      # Developer ID certificate, notarized with notarytool and stapled.
      - name: Apple Developer ID signing and notarization (if configured)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Developer ID signing: on"
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            # codesign matches by name; "Developer ID Application" finds the imported cert.
            echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY:-Developer ID Application}" >> "$GITHUB_ENV"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "Notarization: on"
              echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
              echo "APPLE_PASSWORD=${APPLE_APP_PASSWORD:-$APPLE_PASSWORD}" >> "$GITHUB_ENV"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            fi
          else
            echo "No Apple certificate yet: ad-hoc signing only"
          fi
      # The engines in Resources/bundled are separate programs and dylibs. Tauri only
      # signs the main binary, so sign each one first, with the same identity as the
      # app (notarization rejects any unsigned or ad-hoc code inside a Developer ID app).
      - name: Sign bundled engines (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          id="-"; ts=""; kc=""
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            kc="$RUNNER_TEMP/engines.keychain-db"; pw=$(uuidgen)
            security create-keychain -p "$pw" "$kc"
            security set-keychain-settings -lut 3600 "$kc"
            security unlock-keychain -p "$pw" "$kc"
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" > /dev/null
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            id="$APPLE_SIGNING_IDENTITY"; ts="--timestamp"
          fi
          n=0
          while IFS= read -r f; do
            if file -b "$f" | grep -q Mach-O; then
              codesign --force --options runtime $ts --entitlements src-tauri/Helper.entitlements --sign "$id" "$f"
              n=$((n+1))
            fi
          done < <(find src-tauri/bundled/engines -type f)
          echo "signed $n engine files with identity $id"
          # tauri-action imports the certificate into its own keychain; don't leave a second copy.
          if [ -n "$kc" ]; then security delete-keychain "$kc"; fi
      - name: Windows signing (if configured)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          if [ -n "$TRUSTED_SIGNING_ACCOUNT" ]; then
            cargo install trusted-signing-cli --locked
            for v in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do echo "$v=${!v}" >> "$GITHUB_ENV"; done
            node -e "const f='src-tauri/tauri.conf.json';const j=require('./'+f);j.bundle.windows.signCommand='trusted-signing-cli -e https://eus.codesigning.azure.net -a $TRUSTED_SIGNING_ACCOUNT -c $TRUSTED_SIGNING_PROFILE -d \"Cereal\" %1';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cereal ${{ github.ref_name }}"
          releaseBody: "Free, local, open-source AI meeting notes. No bot joins your call. Download the installer for your computer below (Windows: .exe, Mac: .dmg). Mac: Cereal is not notarized yet; if macOS says it is damaged, run `xattr -dr com.apple.quarantine /Applications/Cereal.app` once in Terminal. See the README for details."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Fail the build if the Mac app or the app inside the DMG isn't properly sealed.
      - name: Verify macOS signature
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          triple=${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
          bundle=target/$triple/release/bundle
          app=$(ls -d "$bundle"/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements :- "$app" | grep -q audio-input
          codesign -d --verbose=4 "$app" 2>&1 | grep -E "^(Authority|Signature|TeamIdentifier|Runtime|flags)" || true
          # Every engine program and dylib inside the app must be signed too, and must start.
          bad=0
          while IFS= read -r f; do
            if file -b "$f" | grep -q Mach-O; then
              codesign --verify --strict "$f" || { echo "::error::not signed: $f"; bad=1; }
            fi
          done < <(find "$app/Contents/Resources" -type f)
          for e in whisper-server llama-server sherpa-onnx-offline-speaker-diarization; do
            p=$(find "$app/Contents/Resources/bundled/engines" -type f -name "$e" | head -1)
            "$p" --help > /dev/null 2>&1 || { echo "::error::$e does not start"; bad=1; }
          done
          [ $bad = 0 ]
          dmg=$(ls "$bundle"/dmg/*.dmg | head -1)
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | awk -F'	' '{print $NF}')
          codesign --verify --deep --strict --verbose=2 "$mnt"/*.app
          hdiutil detach "$mnt"
          syspolicy_check distribution "$app" || true
          if [ -n "${APPLE_ID:-}" ]; then
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          fi

  manifest:
    # toolbay.json for the Toolbay hub, with the real size and sha256 of each installer.
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets
          gh release download "${{ github.ref_name }}" -D assets -p "*.exe" -p "*.dmg"
          node scripts/manifest.mjs assets toolbay.json
          gh release upload "${{ github.ref_name }}" toolbay.json --clobber
